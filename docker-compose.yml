services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    image: abm-server:latest
    container_name: abm-server
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ABM_PORT:-18050}:18050"
    environment:
      ABM_DATABASE_URL: sqlite+aiosqlite:////data/abm.db
      ABM_EDITION: "${ABM_EDITION:-single}"
      ABM_SESSION_COOKIE_SECURE: "${ABM_SESSION_COOKIE_SECURE:-true}"
      ABM_REGISTRATION_REQUIRE_APPROVAL: "${ABM_REGISTRATION_REQUIRE_APPROVAL:-true}"
      ABM_SOCIAL_LOGIN_ENABLED: "${ABM_SOCIAL_LOGIN_ENABLED:-true}"
      ABM_SOCIAL_LOGIN_STATE_TTL_SECONDS: "${ABM_SOCIAL_LOGIN_STATE_TTL_SECONDS:-600}"
      ABM_SOCIAL_GOOGLE_CLIENT_ID: "${ABM_SOCIAL_GOOGLE_CLIENT_ID:-}"
      ABM_SOCIAL_GOOGLE_CLIENT_SECRET: "${ABM_SOCIAL_GOOGLE_CLIENT_SECRET:-}"
      ABM_SOCIAL_GITHUB_CLIENT_ID: "${ABM_SOCIAL_GITHUB_CLIENT_ID:-}"
      ABM_SOCIAL_GITHUB_CLIENT_SECRET: "${ABM_SOCIAL_GITHUB_CLIENT_SECRET:-}"
      ABM_SOCIAL_MICROSOFT_CLIENT_ID: "${ABM_SOCIAL_MICROSOFT_CLIENT_ID:-}"
      ABM_SOCIAL_MICROSOFT_CLIENT_SECRET: "${ABM_SOCIAL_MICROSOFT_CLIENT_SECRET:-}"
      ABM_SOCIAL_MICROSOFT_TENANT: "${ABM_SOCIAL_MICROSOFT_TENANT:-common}"
      ABM_SOCIAL_WECHAT_CLIENT_ID: "${ABM_SOCIAL_WECHAT_CLIENT_ID:-}"
      ABM_SOCIAL_WECHAT_CLIENT_SECRET: "${ABM_SOCIAL_WECHAT_CLIENT_SECRET:-}"
      ABM_SOCIAL_QQ_CLIENT_ID: "${ABM_SOCIAL_QQ_CLIENT_ID:-}"
      ABM_SOCIAL_QQ_CLIENT_SECRET: "${ABM_SOCIAL_QQ_CLIENT_SECRET:-}"
      ABM_BOOTSTRAP_ADMIN_EMAIL: "${ABM_BOOTSTRAP_ADMIN_EMAIL:-}"
      ABM_BOOTSTRAP_ADMIN_PASSWORD: "${ABM_BOOTSTRAP_ADMIN_PASSWORD:-}"
      ABM_PUBLIC_BASE_URL: "${ABM_PUBLIC_BASE_URL:-}"
      ABM_OAUTH_ISSUER_URL: "${ABM_OAUTH_ISSUER_URL:-}"
      ABM_OAUTH_ACCESS_TOKEN_TTL_SECONDS: "${ABM_OAUTH_ACCESS_TOKEN_TTL_SECONDS:-3600}"
      ABM_OAUTH_REFRESH_TOKEN_TTL_SECONDS: "${ABM_OAUTH_REFRESH_TOKEN_TTL_SECONDS:-2592000}"
      ABM_OAUTH_AUTHORIZATION_CODE_TTL_SECONDS: "${ABM_OAUTH_AUTHORIZATION_CODE_TTL_SECONDS:-300}"
      ABM_OAUTH_PENDING_TTL_SECONDS: "${ABM_OAUTH_PENDING_TTL_SECONDS:-600}"
      ABM_MCP_SESSION_LEASE_TTL_SECONDS: "${ABM_MCP_SESSION_LEASE_TTL_SECONDS:-1800}"
      ABM_RESEARCH_PARALLEL_SEARCHES: "${ABM_RESEARCH_PARALLEL_SEARCHES:-2}"
      ABM_RESEARCH_PAUSE_ON_INTERSTITIAL: "${ABM_RESEARCH_PAUSE_ON_INTERSTITIAL:-true}"
      ABM_RESEARCH_ATTENTION_TIMEOUT_SECONDS: "${ABM_RESEARCH_ATTENTION_TIMEOUT_SECONDS:-300}"
      ABM_FORWARDED_ALLOW_IPS: "${ABM_FORWARDED_ALLOW_IPS:-*}"
      ABM_EXTENSION_ID: "${ABM_EXTENSION_ID:-cojffalolochaigkgngieopcefcgbcag}"
      ABM_EXTENSION_GITHUB_URL: "${ABM_EXTENSION_GITHUB_URL:-https://github.com/borgle/abm-extension}"
      ABM_EXTENSION_RELEASE_URL: "${ABM_EXTENSION_RELEASE_URL:-https://github.com/borgle/abm-extension/releases/latest}"
      ABM_EXTENSION_STORE_URL: "${ABM_EXTENSION_STORE_URL:-}"
      ABM_VIDEO_DELIVERY: "${ABM_VIDEO_DELIVERY:-bridge}"
      ABM_RENDER_NO_SANDBOX: "${ABM_RENDER_NO_SANDBOX:-true}"
      ABM_STORAGE_BACKEND: "${ABM_STORAGE_BACKEND:-local}"
      ABM_MEDIA_ROOT: "${ABM_MEDIA_ROOT:-/data/media}"
      ABM_S3_ENDPOINT_URL: "${ABM_S3_ENDPOINT_URL:-}"
      ABM_S3_BUCKET: "${ABM_S3_BUCKET:-abm-media}"
      ABM_S3_ACCESS_KEY_ID: "${ABM_S3_ACCESS_KEY_ID:-}"
      ABM_S3_SECRET_ACCESS_KEY: "${ABM_S3_SECRET_ACCESS_KEY:-}"
      ABM_S3_REGION: "${ABM_S3_REGION:-us-east-1}"
      ABM_S3_PREFIX: "${ABM_S3_PREFIX:-abm}"
      ABM_S3_ADDRESSING_STYLE: "${ABM_S3_ADDRESSING_STYLE:-path}"
      ABM_S3_USE_SSL: "${ABM_S3_USE_SSL:-false}"
      ABM_LOG_LEVEL: "${ABM_LOG_LEVEL:-info}"
    volumes:
      - abm_data:/data

volumes:
  abm_data:

