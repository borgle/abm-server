{% extends "base.html" %}
{% block nav %}
  <a href="/login" data-i18n="nav.login">登录</a>
  <div class="lang-switch" role="group" aria-label="Language / 语言">
    <button type="button" data-lang="en" aria-pressed="true">EN</button>
    <button type="button" data-lang="zh" aria-pressed="false">中文</button>
  </div>
{% endblock %}
{% block content %}
  <section class="hero-card narrow auth-card">
    <p class="eyebrow" data-i18n="forgot.eyebrow">ACCOUNT RECOVERY</p>
    <h1 data-i18n="forgot.title">找回密码</h1>
    <p class="muted" data-i18n="forgot.lead">输入注册邮箱，我们会发送一封重置密码邮件。</p>
    <form id="forgot-form" class="stack">
      <label>
        <span data-i18n="field.email">邮箱</span>
        <input name="email" type="email" autocomplete="email" required />
      </label>
      <button class="button primary" type="submit" data-i18n="forgot.submit">发送重置邮件</button>
    </form>
    <p class="hint" data-i18n="forgot.sent" hidden>如果该邮箱存在，重置邮件已经发送。</p>
    <p class="hint"><a href="/login" data-i18n="forgot.back">返回登录</a></p>
  </section>
{% endblock %}
{% block scripts %}
  <script type="module" src="/static/forgot-password.js?v={{ asset_version }}"></script>
{% endblock %}
