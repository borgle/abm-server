{% extends "base.html" %}
{% block nav %}
  <a href="/login" data-i18n="nav.login">登录</a>
  <div class="lang-switch" role="group" aria-label="Language / 语言">
    <button type="button" data-lang="en" aria-pressed="true">EN</button>
    <button type="button" data-lang="zh" aria-pressed="false">中文</button>
  </div>
{% endblock %}
{% block content %}
  <section class="hero-card narrow auth-card">
    <p class="eyebrow" data-i18n="reset.eyebrow">NEW PASSWORD</p>
    <h1 data-i18n="reset.title">设置新密码</h1>
    <p class="muted" data-i18n="reset.lead">设置后会自动退出其他浏览器会话和 OAuth 凭证。</p>
    <form id="reset-form" class="stack">
      <label>
        <span data-i18n="field.newPassword">新密码</span>
        <input
          name="password"
          type="password"
          minlength="10"
          autocomplete="new-password"
          required
        />
      </label>
      <label>
        <span data-i18n="reset.confirmPassword">确认新密码</span>
        <input
          name="confirm"
          type="password"
          minlength="10"
          autocomplete="new-password"
          required
        />
      </label>
      <button class="button primary" type="submit" data-i18n="reset.submit">保存新密码</button>
    </form>
    <p class="hint" data-i18n="reset.success" hidden>密码已更新，请重新登录。</p>
    <p class="hint" data-i18n="reset.invalid" hidden>链接无效或已过期，请重新申请。</p>
    <p class="hint"><a href="/login" data-i18n="reset.back">返回登录</a></p>
  </section>
{% endblock %}
{% block scripts %}
  <script type="module" src="/static/reset-password.js?v={{ asset_version }}"></script>
{% endblock %}
